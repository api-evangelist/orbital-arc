name: Orbital Arc
description: Orbital Arc is a Houston-based deep-tech spacecraft propulsion startup founded in 2023 by
  Jonathan Huffman, building Gas-Phase Field Effect Electric Propulsion (Gas FEEP) thrusters and the RIOT
  Drive (Relativistic Ion Thrust Drive) for satellites and in-space transportation. Its ultra-lightweight
  electric thrusters use solid naphthalene fuel that sublimates at room temperature instead of noble
  gases, targeting high specific impulse for satellite constellations. Backed by Techstars and Capital
  Factory, the company completed a sub-scale physics demonstration at Oak Ridge National Laboratory (TRL 3).
  This is a hardware company with no public API, SDK, or developer surface as of this enrichment pass.
